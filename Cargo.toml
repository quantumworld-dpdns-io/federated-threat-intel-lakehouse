[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/query-engine",
    "crates/wasm-modules",
]
default-members = ["crates/core", "crates/query-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["quantumworld-dpdns-io"]
repository = "https://github.com/quantumworld-dpdns-io/federated-threat-intel-lakehouse"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
arrow = { version = "53", features = ["prettyprint", "ffi"] }
arrow-array = "53"
arrow-schema = "53"
datafusion = "44"
datafusion-common = "44"
datafusion-expr = "44"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
wasmtime = "29"
wasi-common = "29"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
