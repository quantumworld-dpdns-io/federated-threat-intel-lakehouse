name: Security Tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  owasp-top10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: docker compose up -d
      - run: sleep 15
      - name: Run OWASP Top 10 RobotFramework Tests
        run: python -m robot --loglevel DEBUG --outputdir reports tests/robot/security/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-security-reports
          path: reports/

  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - run: sleep 15
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8000
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
