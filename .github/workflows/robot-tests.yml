name: RobotFramework Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: docker compose up -d
      - run: sleep 15
      - name: Run API Functional Tests
        run: python -m robot --loglevel DEBUG tests/robot/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-functional-reports
          path: |
            log.html
            report.html
            output.xml
